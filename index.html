<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>씨엔브이텍 고객관리 · CVT CRM</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#10262E; --ink-2:#2B4750;
  --teal:#0E7C86; --teal-600:#0B6670; --teal-tint:#E5F2F3;
  --bg:#F1F4F4; --card:#FFFFFF; --line:#E1E8E9; --line-2:#EDF1F1;
  --muted:#5C7079; --muted-2:#8B9BA2;
  --amber:#A9640F; --amber-tint:#FAF0DD;
  --ok:#0C9466; --ok-tint:#E2F4EC;
  --warn:#BE2E1C; --warn-tint:#FBE6E2;
  --violet:#654AB8; --violet-tint:#EDE9F7;
  --gray:#5E7079; --gray-tint:#EBEEEF;
  --sans:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace;
  --shadow:0 1px 2px rgba(16,38,46,.04),0 4px 16px rgba(16,38,46,.06);
  --shadow-lg:0 8px 40px rgba(16,38,46,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
::selection{background:var(--teal-tint)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--ink);color:#CFE0E2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .mark{display:inline-flex;align-items:center;gap:8px}
.brand .tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;background:var(--teal);color:#fff;padding:3px 7px;border-radius:5px;font-weight:600}
.brand .co{font-weight:700;color:#fff;font-size:15px;letter-spacing:-.01em;margin-top:10px}
.brand .sub{font-size:11px;color:#7FA0A5;margin-top:2px;letter-spacing:.02em}
.nav{padding:12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#B7CED0;text-decoration:none;font-size:13.5px;font-weight:500;transition:.12s}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:var(--teal);color:#fff}
.nav a .ic{width:18px;height:18px;flex:none;opacity:.9}
.nav a .badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);color:#DDECEE;padding:1px 7px;border-radius:20px}
.nav a.on .badge{background:rgba(255,255,255,.22)}
.side .foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#6C8B90;line-height:1.6}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(241,244,244,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px}
.search{position:relative;flex:1;max-width:560px}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:0 14px 0 42px;font-size:14px;color:var(--ink);transition:.15s;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-tint)}
.search .si{position:absolute;left:14px;top:12px;color:var(--muted-2)}
.search .hint{position:absolute;right:12px;top:11px;font-family:var(--mono);font-size:11px;color:var(--muted-2);border:1px solid var(--line);padding:2px 6px;border-radius:5px;background:var(--bg)}
.results{position:absolute;top:48px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;max-height:60vh;overflow-y:auto;z-index:40}
.results .grp{padding:8px 14px 4px;font-size:11px;font-weight:700;color:var(--muted-2);letter-spacing:.06em;text-transform:uppercase}
.results .r{padding:9px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;border-top:1px solid var(--line-2)}
.results .r:hover{background:var(--teal-tint)}
.results .r .nm{font-weight:600}
.results .r .mt{color:var(--muted);font-size:12.5px;margin-left:auto;font-family:var(--mono)}
.results .empty{padding:18px 14px;color:var(--muted);font-size:13px}
.top-actions{margin-left:auto;display:flex;gap:8px}

.content{padding:24px 28px 60px;max-width:1200px;width:100%}
.page-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px}
.page-h h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:750}
.page-h .desc{color:var(--muted);font-size:13px;margin-bottom:3px}
.page-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* buttons */
.btn{height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.12s}
.btn:hover{border-color:var(--muted-2);background:#fff}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-600);border-color:var(--teal-600)}
.btn.sm{height:31px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--teal)}
.btn.ghost:hover{background:var(--teal-tint)}
.btn.danger{color:var(--warn);border-color:var(--line)}
.btn.danger:hover{background:var(--warn-tint);border-color:var(--warn-tint)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .lab{font-size:12px;color:var(--muted);font-weight:600}
.stat .val{font-size:28px;font-weight:780;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.stat .dot{position:absolute;top:16px;right:16px;width:9px;height:9px;border-radius:50%}
.stat.a .dot{background:var(--teal)} .stat.b .dot{background:var(--ok)}
.stat.c .dot{background:var(--warn)} .stat.d .dot{background:var(--violet)} .stat.e .dot{background:var(--amber)}

.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel .ph{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.panel .ph h3{margin:0;font-size:14px;font-weight:700}
.panel .ph .more{margin-left:auto}
.panel .pb{padding:6px 8px}

/* channel bars */
.chbar{display:flex;align-items:center;gap:10px;padding:8px 10px}
.chbar .nm{width:120px;font-size:12.5px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chbar .track{flex:1;height:9px;background:var(--line-2);border-radius:6px;overflow:hidden}
.chbar .fill{height:100%;background:linear-gradient(90deg,var(--teal),#3AA6AE);border-radius:6px}
.chbar .n{font-family:var(--mono);font-size:12px;color:var(--muted);width:38px;text-align:right}

/* table */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.toolbar .cnt{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:30px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.fchip:hover{border-color:var(--muted-2)}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mini-in{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:var(--card)}
.mini-in:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--line);background:#FAFCFC;position:sticky;top:0}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
tbody tr{cursor:pointer;transition:.08s}
tbody tr:hover{background:var(--teal-tint)}
tbody tr:last-child td{border-bottom:none}
tbody tr.need{background:#FEF9EE}
tbody tr.need:hover{background:#FBF1DC}
.nm-cell{font-weight:650;color:var(--ink)}
.sub-cell{color:var(--muted);font-size:12.5px}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}
.serial{font-family:var(--mono);font-size:12.5px;background:var(--line-2);color:var(--ink-2);padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.serial .d{width:6px;height:6px;border-radius:50%}
.tabnum{font-variant-numeric:tabular-nums}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%}
.s-normal{background:var(--ok-tint);color:#0A6E4C} .s-normal .d{background:var(--ok)}
.s-return_req{background:var(--warn-tint);color:#912316} .s-return_req .d{background:var(--warn)}
.s-return_done{background:var(--warn-tint);color:#912316} .s-return_done .d{background:var(--warn)}
.s-exchange_req{background:var(--violet-tint);color:#4A3488} .s-exchange_req .d{background:var(--violet)}
.s-exchange_done{background:var(--violet-tint);color:#4A3488} .s-exchange_done .d{background:var(--violet)}
.s-cancelled{background:var(--gray-tint);color:#455158} .s-cancelled .d{background:var(--gray)}
.wpill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.w-in{background:var(--ok-tint);color:#0A6E4C}
.w-soon{background:var(--amber-tint);color:#7C4A0B}
.w-out{background:var(--gray-tint);color:#525E64}

.empty-state{padding:52px 20px;text-align:center;color:var(--muted)}
.empty-state .big{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:6px}

/* drawer */
.backdrop{position:fixed;inset:0;background:rgba(16,38,46,.42);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.backdrop.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(600px,94vw);background:var(--bg);z-index:70;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.show{transform:none}
.dh{padding:20px 22px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.dh .row1{display:flex;align-items:flex-start;gap:12px}
.dh .cname{font-size:20px;font-weight:750;letter-spacing:-.02em}
.dh .cmeta{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.dh .cmeta b{color:var(--ink-2);font-weight:600}
.dh .x{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.dh .x:hover{background:var(--bg)}
.dtabs{display:flex;gap:2px;padding:12px 22px 0;background:var(--card);border-bottom:1px solid var(--line)}
.dtab{padding:9px 14px;border:none;background:none;font-weight:650;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.dtab.on{color:var(--teal);border-bottom-color:var(--teal)}
.dtab .c{font-family:var(--mono);font-size:11px;margin-left:5px;color:var(--muted-2)}
.dbody{flex:1;overflow-y:auto;padding:18px 22px 40px}

.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:14px}
.tl-item:before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:2px solid var(--bg)}
.tl-item.ret:before{background:var(--warn)} .tl-item.exc:before{background:var(--violet)} .tl-item.as:before{background:var(--amber)}
.card-item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.card-item .ci-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.card-item .ci-date{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.card-item .ci-body{font-size:13px;color:var(--ink-2)}
.card-item .ci-meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}

.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;background:var(--card);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint)}
.field textarea{min-height:74px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .mbd{position:absolute;inset:0;background:rgba(16,38,46,.42)}
.modal .mcard{position:relative;background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);width:min(480px,96vw);max-height:90vh;overflow-y:auto}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line-2);display:flex;align-items:center}
.modal .mh h3{margin:0;font-size:16px;font-weight:730}
.modal .mc{padding:18px 22px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line-2);display:flex;gap:9px;justify-content:flex-end}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:100;opacity:0;transition:.24s;box-shadow:var(--shadow-lg);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.banner{background:var(--amber-tint);color:#7C4A0B;padding:9px 16px;font-size:12.5px;font-weight:600;text-align:center;border-bottom:1px solid #EFDCB8}
.hl{background:#FFF4CC;border-radius:3px;padding:0 1px}

@media(max-width:920px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-260px;transition:.2s;z-index:90;width:232px}
  .side.open{left:0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .topbar{padding:12px 14px}
  .content{padding:16px 14px 60px}
  .menu-btn{display:inline-flex!important}
}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);align-items:center;justify-content:center}
.hide-sm{}
@media(max-width:920px){.hide-col{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark"><span class="tag">CVT</span></div>
      <div class="co">씨엔브이텍 고객관리</div>
      <div class="sub">Customer Relationship System</div>
    </div>
    <nav class="nav" id="nav">
      <a data-view="dashboard" class="on"><span class="ic">◧</span>대시보드</a>
      <a data-view="customers"><span class="ic">◔</span>고객 관리<span class="badge" id="nb-cust">0</span></a>
      <a data-view="sales"><span class="ic">◇</span>판매 · 시리얼<span class="badge" id="nb-sale">0</span></a>
      <a data-view="returns"><span class="ic">⇄</span>반품 · 교환<span class="badge" id="nb-ret">0</span></a>
      <a data-view="as"><span class="ic">◈</span>AS · 보증 조회</a>
    </nav>
    <div class="foot">
      씨엔브이텍(주)<br>데이터는 팀과 공유 저장됩니다.
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div class="search">
        <span class="si">⌕</span>
        <input id="gsearch" placeholder="이름 · 연락처 · 시리얼 · 구매처로 통합검색" autocomplete="off">
        <span class="hint">전체검색</span>
        <div class="results" id="gresults" style="display:none"></div>
      </div>
      <div class="top-actions">
        <button class="btn" data-action="backup">⤓ 백업·복원</button>
        <button class="btn pri" data-action="new-customer">＋ 고객 등록</button>
      </div>
    </div>
    <div class="content" id="app"></div>
  </div>
</div>

<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"><div class="mbd" onclick="closeModal()"></div><div class="mcard" id="mcard"></div></div>

function normalizeSales(src){
  const map={returned:'return_done',exchanged:'exchange_done',cancelled:'cancelled',normal:'normal'};
  const out={};
  for(const id in src){const s=src[id];const st=map[s.status]||'normal';out[id]={...s,status:st,statusDate:s.statusDate||'',statusReason:'',reviewed:st==='normal'};}
  return out;
}

/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){if(!d)return'—';return String(d).slice(0,10);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function showBanner(m){const b=document.createElement('div');b.className='banner';b.textContent=m;$('.main').prepend(b);}
function salesOf(cid){return Object.values(STORE.sales).filter(s=>s.customerId===cid);}
function consOf(cid){return Object.values(STORE.consultations).filter(c=>c.customerId===cid).sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
function asOf(serial){return Object.values(STORE.asRecords).filter(a=>a.serial===serial).sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
function asOfCust(cid){const ss=salesOf(cid).map(s=>s.serial);return Object.values(STORE.asRecords).filter(a=>ss.includes(a.serial));}
function productOf(code){return STORE.products.find(p=>p.code===code)||{code,name:code,warrantyMonths:12};}
function warranty(sale){
  if(!sale.date)return{state:'unknown',label:'정보없음',cls:'w-out',end:''};
  const p=productOf(sale.product);const end=new Date(sale.date);end.setMonth(end.getMonth()+(p.warrantyMonths||12));
  const now=new Date();const days=Math.ceil((end-now)/86400000);
  const endStr=end.toISOString().slice(0,10);
  if(days<0)return{state:'out',label:'보증만료',cls:'w-out',end:endStr,days};
  if(days<=45)return{state:'soon',label:'만료임박 '+days+'일',cls:'w-soon',end:endStr,days};
  return{state:'in',label:'보증중 ~'+endStr,cls:'w-in',end:endStr,days};
}
function statusPill(st){return `<span class="pill s-${st}"><span class="d"></span>${STATUS_LABEL[st]||st}</span>`;}
function serialChip(serial,sale){
  if(!serial)return '<span class="sub-cell">—</span>';
  let color='var(--muted-2)';
  if(sale){const w=warranty(sale);color=w.state==='in'?'var(--ok)':w.state==='soon'?'var(--amber)':'var(--gray)';}
  return `<span class="serial"><span class="d" style="background:${color}"></span>${esc(serial)}</span>`;
}

function custRows(){
  let list=Object.values(STORE.customers).map(c=>{
    const ss=salesOf(c.id);const cons=consOf(c.id);
    const hasRet=ss.some(s=>s.status!=='normal');
    return {c,ss,cons,hasRet,last:ss.map(s=>s.date).sort().slice(-1)[0]||''};
  });
  const q=custFilter.q.trim().toLowerCase();
  if(q)list=list.filter(x=>((x.c.name||'')+ (x.c.phone||'')+(x.c.address||'')).toLowerCase().includes(q));
  if(custFilter.status==='has_return')list=list.filter(x=>x.hasRet);
  if(custFilter.status==='has_cons')list=list.filter(x=>x.cons.length>0);
  list.sort((a,b)=>(b.last||'').localeCompare(a.last||''));
  $('#cf-cnt')&&($('#cf-cnt').textContent=list.length+'명');
  const tb=$('#cust-tbody');if(!tb)return;
  if(!list.length){tb.innerHTML=`<tr><td colspan="6"><div class="empty-state"><div class="big">조건에 맞는 고객이 없습니다</div></div></td></tr>`;return;}
  tb.innerHTML=list.slice(0,400).map(x=>{
    const ret=x.hasRet?statusPill(x.ss.find(s=>s.status!=='normal').status):'<span class="pill s-normal"><span class="d"></span>정상</span>';
    return `<tr data-open-cust="${x.c.id}">

      <td class="mono">${esc(x.c.phone||'—')}</td>

      <td class="tabnum">${x.cons.length?x.cons.length+'회':'—'}</td>
      <td>${ret}</td>
    </tr>`;}).join('');
}
function bindCustomerFilters(){

    <tbody>
    ${list.length?list.map(s=>{const cu=STORE.customers[s.customerId]||{};
      return `<tr class="${s.reviewed?'':'need'}" data-open-cust="${s.customerId}">
        <td>${statusPill(s.status)}</td>
        <td><div class="nm-cell">${esc(cu.name||'—')}</div><div class="sub-cell mono">${esc(cu.phone||'')}</div></td>
        <td>${serialChip(s.serial,s)}</td>

      </tr>`;}).join(''):`<tr><td colspan="7"><div class="empty-state"><div class="big">반품·교환 건이 없습니다</div><div>판매 목록이나 고객 상세에서 상태를 변경하면 이곳에 모입니다.</div></div></td></tr>`}
    </tbody></table>
    </div>
  </div>`;

function reviewTable(list,needReview){
  const pending=list.filter(s=>!s.reviewed);const done=list.filter(s=>s.reviewed);
  const ordered=[...pending,...done];
  return `
  <div class="tablewrap">
    <div class="toolbar"><span class="cnt">전체 ${list.length}건 · <b style="color:var(--amber)">검토 필요 ${needReview}건</b></span>
      <span class="cnt" style="margin-left:auto">원본 메모를 보고 사유를 고르면 자동으로 검토완료 처리됩니다</span></div>
    <div style="max-height:calc(100vh - 240px);overflow:auto">
    <table><thead><tr><th>구분</th><th>고객</th><th>시리얼</th><th>원본 메모 (엑셀 원문)</th><th>정리된 사유</th><th>검토</th></tr></thead>
    <tbody>
    ${ordered.map(s=>{const cu=STORE.customers[s.customerId]||{};
      const custom=s.statusReason&&!RETURN_REASONS.includes(s.statusReason);
      return `<tr class="${s.reviewed?'':'need'}">
        <td>${statusPill(s.status)}</td>
        <td class="nm-cell">${esc(cu.name||'—')}</td>
        <td>${serialChip(s.serial,s)}</td>
        <td class="sub-cell" style="max-width:230px">${esc(s.statusNote||'—')}</td>
        <td onclick="event.stopPropagation()"><select class="mini-in rv-reason" data-id="${s.id}" style="width:158px">
          <option value="">— 사유 선택 —</option>
          ${RETURN_REASONS.map(r=>`<option ${s.statusReason===r?'selected':''}>${r}</option>`).join('')}
          ${custom?`<option selected>${esc(s.statusReason)}</option>`:''}
        </select></td>
        <td onclick="event.stopPropagation()"><label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px"><input type="checkbox" class="rv-done" data-id="${s.id}" ${s.reviewed?'checked':''}> 완료</label></td>
      </tr>`;}).join('')}
    </tbody></table>
    </div>
  </div>`;
}
function bindReturns(){
  const c=$('#app');if(!c)return;
  c.querySelectorAll('.rv-reason').forEach(sel=>sel.addEventListener('change',()=>{
    const s=STORE.sales[sel.dataset.id];if(!s)return;s.statusReason=sel.value;if(sel.value)s.reviewed=true;saveSales();

    const s=STORE.sales[cb.dataset.id];if(!s)return;s.reviewed=cb.checked;saveSales();

  }));
}

      <div class="card-item">
        <div class="ci-h"><span class="pill s-normal" style="background:var(--teal-tint);color:var(--teal-600)"><span class="d" style="background:var(--teal)"></span>${esc(cn.type)}</span><span class="ci-date" style="margin-left:auto">${fmtDate(cn.date)}</span></div>

        </div>
      </div></div>`).join('')}</div>`;
  }
  if(DRAWER.tab==='ret'){
    const rets=ss.filter(s=>s.status!=='normal');
    if(!rets.length)return emptyBox('반품·교환 이력이 없습니다','구매 탭에서 “반품·교환 처리”로 상태를 등록할 수 있습니다.');

    <div class="mh"><h3>AS 접수</h3></div>
    <div class="mc">
      <div class="field"><label>시리얼</label><input id="f-serial" class="mono" value="${esc(serial)}"></div>
      <div class="field-row">
        <div class="field"><label>접수일</label><input id="f-date" type="date" value="${today()}"></div>
        <div class="field"><label>상태</label><select id="f-st"><option>접수</option><option>수리중</option><option>완료</option><option>보류</option></select></div>
      </div>
      <div class="field"><label>증상</label><textarea id="f-symptom" placeholder="고객이 알려준 증상"></textarea></div>
      <div class="field"><label>조치 내용</label><textarea id="f-action" placeholder="수리·교체 조치"></textarea></div>
      <div class="field-row">
        <div class="field"><label>비용</label><input id="f-cost" placeholder="무상 / 30,000원"></div>
        <div class="field"><label>담당</label><input id="f-handler"></div>
      </div>
    </div>
    <div class="mf"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" id="f-save">저장</button></div>`);
  $('#f-save').onclick=async()=>{
    const id=uid('as');
    STORE.asRecords[id]={id,serial:$('#f-serial').value.trim(),customerId:cid,date:$('#f-date').value,status:$('#f-st').value,symptom:$('#f-symptom').value.trim(),action:$('#f-action').value.trim(),cost:$('#f-cost').value.trim(),handler:$('#f-handler').value.trim()};
    await saveAS();closeModal();render();if($('#drawer').classList.contains('show'))renderDrawer();if(VIEW==='as')renderASResult();toast('AS가 접수되었습니다');
  };
}

function mProducts(){
  const rows=STORE.products.map((p,i)=>`<div class="field-row" style="grid-template-columns:1fr 1.6fr .9fr auto;align-items:end;margin-bottom:8px">
    <div class="field" style="margin:0"><label>코드</label><input class="p-code" value="${esc(p.code)}"></div>
    <div class="field" style="margin:0"><label>품목명</label><input class="p-name" value="${esc(p.name)}"></div>
    <div class="field" style="margin:0"><label>보증(개월)</label><input class="p-w" type="number" value="${p.warrantyMonths||12}"></div>
    <button class="btn sm danger" data-del-prod="${i}" style="margin-bottom:2px">삭제</button>
  </div>`).join('');
  openModal(`
    <div class="mh"><h3>품목 관리</h3></div>
    <div class="mc" id="prod-list">${rows}
      <button class="btn sm" id="add-prod" style="margin-top:6px">＋ 품목 추가</button>
    </div>
    <div class="mf"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" id="f-save">저장</button></div>`);
  $('#add-prod').onclick=()=>{STORE.products.push({code:'',name:'',warrantyMonths:12});mProducts();};
  $('#prod-list').addEventListener('click',e=>{const b=e.target.closest('[data-del-prod]');if(b){STORE.products.splice(+b.dataset.delProd,1);mProducts();}});
  $('#f-save').onclick=async()=>{
    const codes=[...document.querySelectorAll('.p-code')],names=[...document.querySelectorAll('.p-name')],ws=[...document.querySelectorAll('.p-w')];
    const arr=[];codes.forEach((c,i)=>{if(c.value.trim())arr.push({code:c.value.trim(),name:names[i].value.trim()||c.value.trim(),warrantyMonths:+ws[i].value||12});});
    if(!arr.length){toast('최소 1개 품목이 필요합니다');return;}
    STORE.products=arr;await sset(K.prod,STORE.products);closeModal();render();toast('품목이 저장되었습니다');
  };
}

/* ---------------- backup / export / restore ---------------- */
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
function exportJson(){
  const data=JSON.stringify({customers:STORE.customers,sales:STORE.sales,consultations:STORE.consultations,asRecords:STORE.asRecords,products:STORE.products,exportedAt:new Date().toISOString()},null,2);
  download(`CVT_CRM_전체백업_${today()}.json`,new Blob([data],{type:'application/json'}));toast('전체 백업 파일을 저장했습니다');
}
function exportXlsx(){
  if(typeof XLSX==='undefined'){toast('엑셀 모듈을 불러오는 중입니다 — 잠시 후 다시 시도하세요');return;}
  const custRows=Object.values(STORE.customers).map(c=>({고객명:c.name||'',연락처:c.phone||'',주소:c.address||'',메모:c.memo||'',구매건수:salesOf(c.id).length}));
  const saleRows=Object.values(STORE.sales).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(s=>{const cu=STORE.customers[s.customerId]||{};const w=warranty(s);return {출고일:s.date||'',고객명:cu.name||'',연락처:cu.phone||'',구매처:s.channel||'',품목:s.product||'',시리얼:s.serial||'',수량:s.qty||1,상태:STATUS_LABEL[s.status]||s.status,사유:s.statusReason||s.statusNote||'',처리일:s.statusDate||'',보증만료:w.end||'',비고:s.note||''};});
  const consRows=Object.values(STORE.consultations).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(c=>{const cu=STORE.customers[c.customerId]||{};return {일자:c.date||'',고객명:cu.name||'',연락처:cu.phone||'',유형:c.type||'',내용:c.content||'',담당:c.handler||'',후속조치:c.followUp||''};});
  const asRows=Object.values(STORE.asRecords).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(a=>{const cu=STORE.customers[a.customerId]||{};return {접수일:a.date||'',시리얼:a.serial||'',고객명:cu.name||'',상태:a.status||'',증상:a.symptom||'',조치:a.action||'',비용:a.cost||'',담당:a.handler||''};});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(custRows.length?custRows:[{고객명:''}]),'고객');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(saleRows.length?saleRows:[{출고일:''}]),'판매');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(consRows.length?consRows:[{일자:'',내용:''}]),'상담');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(asRows.length?asRows:[{접수일:'',시리얼:''}]),'AS');
  XLSX.writeFile(wb,`씨엔브이텍_CRM_${today()}.xlsx`);toast('엑셀 파일을 내보냈습니다');
}
function importJson(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.customers||!d.sales){toast('올바른 백업 파일이 아닙니다');return;}
      if(!confirm('현재 데이터를 이 백업 내용으로 완전히 대체합니다. 계속할까요?')){e.target.value='';return;}
      STORE.customers=d.customers;STORE.sales=d.sales;STORE.consultations=d.consultations||{};STORE.asRecords=d.asRecords||{};if(d.products)STORE.products=d.products;
      await saveCust();await saveSales();await saveCons();await saveAS();await sset(K.prod,STORE.products);
      closeModal();render();toast('백업을 복원했습니다');
    }catch(err){toast('복원 실패 — 파일 형식을 확인하세요');console.error(err);}
  };
  rd.readAsText(f);
}
function mBackup(){
  openModal(`
    <div class="mh"><h3>백업 · 복원</h3></div>
    <div class="mc">
      <div class="field"><label>① 엑셀로 내보내기</label>
        <div class="sub-cell" style="margin-bottom:9px">고객·판매·상담·AS를 시트별로 담은 .xlsx 파일을 내려받습니다. 보고·공유용으로 적합합니다.</div>
        <button class="btn pri" id="b-xlsx">⤓ 엑셀(.xlsx) 다운로드</button></div>
      <div class="field" style="margin-top:20px"><label>② 전체 백업 (JSON)</label>
        <div class="sub-cell" style="margin-bottom:9px">모든 데이터를 원본 그대로 저장합니다. 아래 ‘복원’에 그대로 넣으면 되살릴 수 있습니다.</div>
        <button class="btn" id="b-json">⤓ 전체 백업 파일 저장</button></div>
      <div class="field" style="margin-top:20px"><label>③ 백업 복원</label>
        <div class="sub-cell" style="margin-bottom:9px;color:var(--warn)">주의 — 현재 데이터를 선택한 백업 파일 내용으로 완전히 대체합니다.</div>
        <input type="file" id="b-file" accept="application/json,.json" class="mini-in" style="width:100%;height:auto;padding:8px"></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeModal()">닫기</button></div>`);
  $('#b-xlsx').onclick=exportXlsx;$('#b-json').onclick=exportJson;$('#b-file').onchange=importJson;
}

/* ---------------- global search ---------------- */
const gs=$('#gsearch'),gr=$('#gresults');
gs.addEventListener('input',()=>{
  const q=gs.value.trim().toLowerCase();
  if(!q){gr.style.display='none';return;}
  const custs=Object.values(STORE.customers).filter(c=>((c.name||'')+(c.phone||'')).toLowerCase().includes(q)).slice(0,6);
  const serials=Object.values(STORE.sales).filter(s=>(s.serial||'').toLowerCase().includes(q)).slice(0,6);
  const chans=[...new Set(Object.values(STORE.sales).map(s=>s.channel).filter(ch=>ch&&ch.toLowerCase().includes(q)))].slice(0,4);
  let h='';
  if(custs.length){h+='<div class="grp">고객</div>'+custs.map(c=>`<div class="r" data-open-cust="${c.id}"><span class="nm">${esc(c.name)}</span><span class="mt">${esc(c.phone||'')}</span></div>`).join('');}
  if(serials.length){h+='<div class="grp">시리얼</div>'+serials.map(s=>{const cu=STORE.customers[s.customerId]||{};return `<div class="r" data-gs-serial="${esc(s.serial)}"><span class="serial">${esc(s.serial)}</span><span class="mt">${esc(cu.name||'')}</span></div>`;}).join('');}
  if(chans.length){h+='<div class="grp">구매처</div>'+chans.map(c=>`<div class="r" data-gs-chan="${esc(c)}"><span class="nm">${esc(c)}</span><span class="mt">채널로 필터</span></div>`).join('');}
  if(!h)h='<div class="empty">검색 결과가 없습니다</div>';
  gr.innerHTML=h;gr.style.display='block';
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))gr.style.display='none';});

/* ---------------- global click delegation ---------------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const navA=t.closest('#nav a');if(navA){VIEW=navA.dataset.view;$('#side').classList.remove('open');render();return;}
  const go=t.closest('[data-view-go]');if(go){VIEW=go.dataset.viewGo;render();return;}
  const oc=t.closest('[data-open-cust]');if(oc){openCust(oc.dataset.openCust);gr.style.display='none';gs.value='';return;}
  const gsS=t.closest('[data-gs-serial]');if(gsS){VIEW='as';asQuery=gsS.dataset.gsSerial;render();gr.style.display='none';gs.value='';return;}
  const gsC=t.closest('[data-gs-chan]');if(gsC){VIEW='sales';salesFilter.channel=gsC.dataset.gsChan;render();gr.style.display='none';gs.value='';return;}

  const rm=t.closest('[data-rmode]');if(rm){returnsMode=rm.dataset.rmode;render();return;}
  const act=t.closest('[data-action]');if(act){const a=act.dataset.action;
    if(a==='new-customer')mCustomer(null);
    if(a==='new-sale')mSale(null,null);
    if(a==='manage-products')mProducts();
    if(a==='backup')mBackup();
    return;}
  const es=t.closest('[data-edit-status]');if(es){e.stopPropagation();mStatus(STORE.sales[es.dataset.editStatus]);return;}
  const na=t.closest('[data-new-as]');if(na){const[serial,cid]=na.dataset.newAs.split('|');mAS(serial,cid);return;}
  const ec=t.closest('[data-edit-cust]');if(ec){mCustomer(STORE.customers[ec.dataset.editCust]);return;}
  const ac=t.closest('[data-add-cons]');if(ac){mCons(STORE.customers[ac.dataset.addCons],null);return;}
  const asf=t.closest('[data-add-sale-for]');if(asf){mSale(null,asf.dataset.addSaleFor);return;}
  const edc=t.closest('[data-edit-cons]');if(edc){e.preventDefault();mCons(null,STORE.consultations[edc.dataset.editCons]);return;}
  const dlc=t.closest('[data-del-cons]');if(dlc){e.preventDefault();if(confirm('이 상담 기록을 삭제할까요?')){delete STORE.consultations[dlc.dataset.delCons];saveCons();renderDrawer();render();toast('삭제되었습니다');}return;}
  const dla=t.closest('[data-del-as]');if(dla){e.preventDefault();if(confirm('이 AS 기록을 삭제할까요?')){delete STORE.asRecords[dla.dataset.delAs];saveAS();renderDrawer();render();toast('삭제되었습니다');}return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();gr.style.display='none';}
  if((e.key==='/'||(e.metaKey&&e.key==='k'))&&document.activeElement!==gs){e.preventDefault();gs.focus();}});

init();
</script>
</body>
</html>
